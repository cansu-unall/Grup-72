# Docker Compose configuration for DyslexiAI project
version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: dyslexia-backend
    ports:
      - "8003:8003"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
    depends_on:
      - db
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8003", "--reload"]

  frontend:
    build:
      context: ./frontend
    container_name: dyslexia-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host"]
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
      - db

  db:
    image: postgres:15-alpine
    container_name: dyslexia-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
